# Builds the Fuel Log app and outfit builder and publishes them to the
# gh-pages branch. One-time setup: Settings → Pages → Deploy from a branch →
# gh-pages, / (root).
name: Publish apps

on:
  push:
    branches: [claude/cool-euler-9lyqf5, claude/elite-interview-prep-agent-ew3dch]
    paths: [gym-tracker/**, outfit-builder/**, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test gym-tracker/nutrition.test.js gym-tracker/workouts.test.js outfit-builder/engine.test.js
      - name: Build
        run: node site/build.mjs
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
