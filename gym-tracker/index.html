<title>Fuel Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, tabs pinned to the bottom like a gym app.
   Macros wear competition bumper-plate colours: protein red, carbs blue, fat yellow. */
:root {
  --bg: #F3F4F2;
  --card: #FFFFFF;
  --ink: #17191C;
  --muted: #5D636B;
  --line: #DADDDF;
  --chalk: #E9EBE8;
  --primary: #17191C;
  --primary-ink: #FFFFFF;
  --protein: #C8383B;
  --carbs: #2F6FC4;
  --fat: #B58A0A;
  --fibre: #5D636B;
  --good: #2C7A4B;
  --warn: #A25B00;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121315; --card: #1B1D20; --ink: #ECEDEE; --muted: #9AA0A8; --line: #2D3035; --chalk: #24272B;
    --primary: #ECEDEE; --primary-ink: #121315;
    --protein: #E05A5A; --carbs: #4A86D6; --fat: #B08A1E; --fibre: #9AA0A8; --good: #6CC08E; --warn: #E0A250;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121315; --card: #1B1D20; --ink: #ECEDEE; --muted: #9AA0A8; --line: #2D3035; --chalk: #24272B;
  --primary: #ECEDEE; --primary-ink: #121315;
  --protein: #E05A5A; --carbs: #4A86D6; --fat: #B08A1E; --fibre: #9AA0A8; --good: #6CC08E; --warn: #E0A250;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; padding-inline: 16px; padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
header.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 4px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; letter-spacing: 0.01em; text-transform: uppercase; line-height: 1; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 0.78rem; letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 4px; }
.store { font-size: 12px; color: var(--muted); text-align: right; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.02em; margin: 0; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; text-transform: uppercase; letter-spacing: 0.04em; margin: 0; color: var(--muted); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.btn { border: 0; border-radius: 8px; padding: 11px 16px; background: var(--primary); color: var(--primary-ink); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--carbs); outline-offset: 2px; }
input[type="number"], input[type="text"], input[type="search"], input[type="date"], select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; width: 100%; }
label.field { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); min-width: 0; }
label.field > span { font-weight: 500; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* Today */
.daynav { display: flex; align-items: center; justify-content: space-between; }
.daynav button { background: none; border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 36px; font-size: 18px; }
.daynav button:disabled { opacity: 0.35; cursor: default; }
.daynav h2 { text-align: center; flex: 1; }
.left { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.left .big { font-family: var(--font-display); font-weight: 700; font-size: 3.4rem; line-height: 0.9; font-variant-numeric: tabular-nums; }
.left .over { color: var(--warn); }
.macros { display: grid; gap: 9px; }
.macro { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; }
.macro .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.macro .name i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.track { height: 8px; border-radius: 4px; background: var(--chalk); overflow: hidden; }
.track b { display: block; height: 100%; border-radius: 4px; }
.macro .val { font-family: var(--font-num); font-size: 13px; color: var(--muted); white-space: nowrap; }
.macro .val strong { color: var(--ink); font-weight: 500; }
.meal { display: grid; gap: 2px; }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.entry:last-child { border-bottom: 0; }
.entry .nm { overflow-wrap: anywhere; }
.entry .sub { font-size: 12.5px; color: var(--muted); }
.x { background: none; border: 0; color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
.x:hover { color: var(--protein); }
.sugg { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.sugg:first-of-type { border-top: 0; }
.sugg .why { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-family: var(--font-num); padding: 1px 7px; border-radius: 999px; background: var(--chalk); }
.empty { color: var(--muted); font-size: 14px; }

/* Weight */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { display: grid; gap: 2px; }
.stat .k { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat .v { font-family: var(--font-display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12.5px; color: var(--muted); }
.chart-wrap { position: relative; }
.chart-wrap svg { width: 100%; height: auto; display: block; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.hist { display: grid; }
.hist .entry { grid-template-columns: minmax(0, 1fr) auto auto; }

/* Insights */
.insight { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14.5px; }
.insight .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--card); margin-top: 2px; }
.ic.good { background: var(--good); } .ic.warn { background: var(--warn); } .ic.swap { background: var(--carbs); } .ic.info { background: var(--muted); }
.coach { white-space: pre-wrap; font-size: 14.5px; }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; z-index: 5; }
nav.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 560px; gap: 4px; }
nav.tabs button { background: none; border: 0; padding: 8px 4px; border-radius: 8px; font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; font-size: 15px; color: var(--muted); }
nav.tabs button[aria-current="page"] { color: var(--ink); background: var(--chalk); }

/* Add-food sheet */
dialog { border: 0; padding: 0; width: min(560px, 100%); max-height: 92vh; border-radius: 14px 14px 0 0; background: var(--card); color: var(--ink); margin: auto auto 0; }
dialog::backdrop { background: rgba(0,0,0,0.45); }
.sheet { padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { position: relative; display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 12px; }
.choice strong { font-family: var(--font-display); text-transform: uppercase; font-size: 1.05rem; letter-spacing: 0.03em; }
.choice span { font-size: 12.5px; color: var(--muted); }
.choice input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.results { display: grid; max-height: 40vh; overflow-y: auto; }
.result { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 10px 2px; }
.status { font-size: 14px; padding: 10px 12px; border-radius: 8px; background: var(--chalk); }
.status.warn { color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 11px; font-size: 13.5px; }
.preview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.preview div { background: var(--chalk); border-radius: 8px; padding: 8px 4px; }
.preview b { display: block; font-family: var(--font-display); font-size: 1.4rem; line-height: 1; }
.preview span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 380px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Fuel Log<small id="goal-line">Weight, food and what to eat next</small></div>
    <div class="store" id="store">Loading…</div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button type="button" data-tab="today">Today</button>
  <button type="button" data-tab="weight">Weight</button>
  <button type="button" data-tab="foods">Foods</button>
  <button type="button" data-tab="plan">Plan</button>
</div></nav>

<dialog id="sheet" aria-label="Add food"><div class="sheet" id="sheet-body"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="nutrition.js"></script>
<script>
(function () {
  const N = window.Nutrition;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => N.iso(new Date());
  const uid = () => Math.random().toString(36).slice(2, 10);

  // ---------- State and storage ----------
  // Saved to your Claude account when this runs as a Claude artifact, otherwise to this browser.
  const S = { profile: null, weights: {}, foods: {}, days: {} };
  const LOCAL = "fuel-log-v1";
  let mode = "local", refs = null, sample = null, imagesOk = false;
  let booting = !!(window.claude && window.claude.use); // wait for saved data before showing setup
  // Claude artifacts can't open the camera; the installed app can.
  const liveScanOk = !(window.claude && window.claude.use) && window.isSecureContext && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!window.ZXing;
  const installed = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  const queues = {};

  function loadLocal() {
    try { Object.assign(S, JSON.parse(localStorage.getItem(LOCAL) || "{}")); } catch (e) {}
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL, JSON.stringify(S)); } catch (e) {}
  }
  function write(ref, data) {
    const k = ref.path;
    queues[k] = (queues[k] || Promise.resolve()).then(() => (data ? ref.set(data) : ref.delete())).catch((e) => {
      if (e && e.code === "quota_exceeded") flash("Storage is full. Delete some old foods to keep saving.");
      else if (e && e.code === "unavailable") return new Promise((r) => setTimeout(r, 800 + Math.random() * 800)).then(() => (data ? ref.set(data) : ref.delete()));
    });
  }
  const store = {
    profile(p) { S.profile = p; if (mode === "db") write(refs.profile, p); else saveLocal(); },
    weight(date, kg) {
      if (kg == null) delete S.weights[date]; else S.weights[date] = kg;
      if (mode === "db") write(refs.weights.doc(date), kg == null ? null : { date, kg }); else saveLocal();
    },
    food(f) { S.foods[f.id] = f; if (mode === "db") write(refs.foods.doc(f.id), f); else saveLocal(); },
    dropFood(id) { delete S.foods[id]; if (mode === "db") write(refs.foods.doc(id), null); else saveLocal(); },
    day(date, day) {
      if (!day.entries.length) delete S.days[date]; else S.days[date] = day;
      if (mode === "db") write(refs.days.doc(date), day.entries.length ? { date, entries: day.entries } : null); else saveLocal();
    },
  };

  async function connect() {
    const C = window.claude;
    if (!C || !C.use) { setStore(); return; }
    const [db, user, smp] = await Promise.all([C.use("db"), C.use("user"), C.use("sample")]);
    if (smp) {
      sample = smp;
      try { imagesOk = !!(await smp.limits()).images; } catch (e) { imagesOk = false; }
    }
    const id = user ? await user.id() : null;
    if (db && id) {
      const base = db.doc("data/users/" + id + "/profile");
      refs = { profile: base, weights: base.collection("weights"), foods: base.collection("foods"), days: base.collection("days") };
      mode = "db";
      S.profile = null; S.weights = {}; S.foods = {}; S.days = {};
      const ready = new Set();
      const got = (k) => { ready.add(k); if (ready.size === 4) { booting = false; render(); } };
      const fail = (e) => { if (e && e.code !== "unavailable") flash("Lost connection to your saved data. Reload to reconnect."); };
      base.onSnapshot((s) => { S.profile = s.exists ? s.data() : null; got("p"); }, fail);
      refs.weights.onSnapshot((q) => { S.weights = Object.fromEntries(q.docs.map((d) => [d.id, d.data().kg])); got("w"); }, fail);
      refs.foods.onSnapshot((q) => { S.foods = Object.fromEntries(q.docs.map((d) => [d.id, d.data()])); got("f"); }, fail);
      refs.days.orderBy("date", "desc").limit(180).onSnapshot((q) => { S.days = Object.fromEntries(q.docs.map((d) => [d.id, { entries: d.data().entries || [] }])); got("d"); }, fail);
      setStore();
      return;
    }
    booting = false;
    setStore();
    render();
  }
  function setStore() {
    $("#store").textContent = mode === "db" ? "Saved to your Claude account" : installed ? "Saved on this phone" : "Saved in this browser";
  }

  // ---------- Units ----------
  const unit = () => (S.profile && S.profile.unit) || "kg";
  const fmtW = (kg, d = 1) => (kg == null ? "–" : unit() === "lb" ? (kg * 2.20462).toFixed(d) : kg.toFixed(d));
  const toKg = (v) => (unit() === "lb" ? v / 2.20462 : v);

  // ---------- Routing ----------
  let tab = "today", viewDate = today(), weightRange = 90, foodQuery = "", coachText = "", coachBusy = false;
  const tabs = ["today", "weight", "foods", "plan"];
  if (tabs.includes(location.hash.slice(1))) tab = location.hash.slice(1);
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); }));

  function flash(msg) {
    const el = document.createElement("div");
    el.className = "status warn"; el.setAttribute("role", "status"); el.textContent = msg;
    $("#view").prepend(el); setTimeout(() => el.remove(), 6000);
  }

  function currentTargets() {
    return S.profile ? N.targets(S.profile, S.weights, S.days, today()) : null;
  }

  function render() {
    document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    const t = currentTargets();
    $("#goal-line").textContent = S.profile ? `${N.GOALS[S.profile.goal].label} · ${t.kcal} kcal · ${t.p}g protein` : "Weight, food and what to eat next";
    const v = $("#view");
    if (booting) { v.innerHTML = `<div class="card"><p class="empty" style="margin:0">Loading your log…</p></div>`; return; }
    if (!S.profile && tab !== "plan") { v.innerHTML = setupCard(); bindSetup(); return; }
    if (tab === "today") v.innerHTML = todayView(t);
    else if (tab === "weight") v.innerHTML = weightView(t);
    else if (tab === "foods") v.innerHTML = foodsView();
    else v.innerHTML = planView(t);
    bind[tab] && bind[tab](t);
  }

  // ---------- Setup / profile ----------
  const DEFAULT_PROFILE = { goal: "lose", ratePct: 0.5, sex: "male", age: 30, heightCm: 178, startWeight: 82, activity: "moderate", unit: "kg" };
  function profileForm(p, submitLabel) {
    const seg = (name, opts, val) => `<div class="seg" data-seg="${name}">${opts.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${String(val) === String(v)}">${l}</button>`).join("")}</div>`;
    const rates = p.goal === "gain" ? [[0.25, "0.25%/wk"], [0.5, "0.5%/wk"]] : [[0.25, "0.25%/wk"], [0.5, "0.5%/wk"], [0.75, "0.75%/wk"], [1, "1%/wk"]];
    return `<form id="pf" class="card">
      <div class="grid2" style="grid-template-columns:minmax(0,1fr)">
        <label class="field"><span>Goal</span>${seg("goal", [["lose", "Lose fat"], ["maintain", "Maintain"], ["gain", "Build muscle"]], p.goal)}</label>
        ${p.goal !== "maintain" ? `<label class="field"><span>Pace (share of body weight per week)</span>${seg("ratePct", rates, p.ratePct)}</label>` : ""}
      </div>
      <div class="grid3">
        <label class="field"><span>Weight (${p.unit || "kg"})</span><input id="pf-weight" type="number" step="0.1" inputmode="decimal" value="${p.unit === "lb" ? (p.startWeight * 2.20462).toFixed(1) : p.startWeight}"></label>
        <label class="field"><span>Height (cm)</span><input id="pf-height" type="number" inputmode="numeric" value="${p.heightCm}"></label>
        <label class="field"><span>Age</span><input id="pf-age" type="number" inputmode="numeric" value="${p.age}"></label>
      </div>
      <label class="field"><span>Sex (for the calorie formula)</span>${seg("sex", [["male", "Male"], ["female", "Female"]], p.sex)}</label>
      <label class="field"><span>Activity outside the gym, plus training</span>${seg("activity", [["sedentary", "Desk job, little training"], ["light", "Train 1–3×/wk"], ["moderate", "Train 3–5×/wk"], ["very", "Train hard 6×/wk"]], p.activity)}</label>
      <label class="field"><span>Units</span>${seg("unit", [["kg", "kg"], ["lb", "lb"]], p.unit || "kg")}</label>
      <button class="btn wide" type="submit">${submitLabel}</button>
    </form>`;
  }
  let draft = null;
  function bindProfile(after) {
    const f = $("#pf");
    f.querySelectorAll("[data-seg]").forEach((g) => g.addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      readDraft();
      const k = g.dataset.seg; let val = b.dataset.v;
      if (k === "ratePct") val = Number(val);
      if (k === "unit" && val !== draft.unit) { draft.unit = val; }
      draft[k] = val;
      if (k === "goal") draft.ratePct = val === "gain" ? 0.25 : 0.5;
      render();
    }));
    f.addEventListener("submit", (e) => {
      e.preventDefault(); readDraft();
      const first = !S.profile, latest = N.latestWeight(S.weights);
      store.profile({ ...draft });
      // Record a weigh-in only when the weight was actually entered or changed here.
      if (first || latest == null || Math.abs(draft.startWeight - latest) >= 0.05) store.weight(today(), draft.startWeight);
      draft = null; after && after(); render();
    });
  }
  function readDraft() {
    const w = Number($("#pf-weight").value), u = draft.unit || "kg";
    if (w) draft.startWeight = Math.round((u === "lb" ? w / 2.20462 : w) * 10) / 10;
    draft.heightCm = Number($("#pf-height").value) || draft.heightCm;
    draft.age = Number($("#pf-age").value) || draft.age;
  }
  function setupCard() {
    draft = draft || { ...DEFAULT_PROFILE };
    return `<div class="card"><h2>Set your goal</h2><p class="muted small" style="margin:0">These starting values are examples. Change them to yours and your daily calorie and protein targets are worked out for you. Once you've logged a few weeks of food and weight, the targets adjust to your real metabolism.</p></div>` + profileForm(draft, "Save and start");
  }
  function bindSetup() { bindProfile(); }

  // ---------- Today ----------
  function macroRow(label, color, eaten, target, unitLabel = "g") {
    const pct = target ? Math.min(100, (eaten / target) * 100) : 0;
    return `<div class="macro"><span class="name"><i style="background:${color}"></i>${label}</span>
      <div class="track" role="img" aria-label="${label} ${eaten} of ${target}${unitLabel}"><b style="width:${pct}%;background:${color}"></b></div>
      <span class="val"><strong>${Math.round(eaten)}</strong> / ${target}${unitLabel}</span></div>`;
  }
  function todayView(t) {
    const day = S.days[viewDate] || { entries: [] };
    const tot = N.totals(day.entries);
    const left = t.kcal - tot.kcal;
    const isToday = viewDate === today();
    const label = isToday ? "Today" : viewDate === N.addDays(today(), -1) ? "Yesterday" : new Date(viewDate + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    const meals = N.MEALS.map((m) => {
      const es = day.entries.map((e, i) => ({ e, i })).filter(({ e }) => e.meal === m);
      const mt = N.totals(es.map((x) => x.e));
      return `<div class="meal"><div class="meal-head"><h3>${m}</h3><span class="small muted num">${es.length ? mt.kcal + " kcal" : ""}</span></div>
        ${es.length ? es.map(({ e, i }) => `<div class="entry"><div><div class="nm">${esc(e.name)}</div><div class="sub">${e.grams}g · ${e.p}g protein</div></div><span class="num small">${e.kcal}</span><button class="x" type="button" data-del="${i}" aria-label="Remove ${esc(e.name)}">×</button></div>`).join("") : `<div class="empty small" style="padding:6px 0">Nothing yet</div>`}
      </div>`;
    }).join("");

    let sugg = "";
    if (isToday) {
      const meal = N.mealForHour(new Date().getHours());
      const s = N.suggest({ foods: S.foods, days: S.days, today: viewDate, target: t, goal: S.profile.goal, meal });
      const body = s.note ? `<p class="empty">${esc(s.note)}</p>`
        : s.items.length ? s.items.map((it, i) => `<div class="sugg"><div><div>${esc(it.food.name)} <span class="pill">${it.grams}g</span></div>
            <div class="why">${it.n.kcal} kcal · ${it.n.p}g protein${it.why.length ? " · " + esc(it.why.join(", ")) : ""}</div></div>
            <button class="btn small" type="button" data-sugg="${i}">Add</button></div>`).join("")
        : `<p class="empty">Suggestions come from foods you've logged. Add a few meals and they'll appear here, ranked for your goal.</p>`;
      sugg = `<section class="card"><div class="row spread"><h2>Eat next</h2><span class="small muted">${Math.max(0, Math.round(s.remaining.p))}g protein left</span></div>${body}</section>`;
      lastSuggestions = s.items;
    }

    const weighCard = isToday && S.weights[viewDate] == null ? `<section class="card"><form class="row" id="quick-weigh"><label class="field" style="flex:1"><span>Morning weigh-in (${unit()})</span><input id="qw" type="number" step="0.1" inputmode="decimal" placeholder="${fmtW(N.latestWeight(S.weights))}"></label><button class="btn" type="submit" style="align-self:end">Save</button></form></section>` : "";

    return `<div class="app" style="gap:14px">
      <div class="daynav"><button type="button" id="prev" aria-label="Previous day">‹</button><h2>${label}</h2><button type="button" id="next" aria-label="Next day" ${isToday ? "disabled" : ""}>›</button></div>
      <section class="card">
        <div class="row spread" style="align-items:flex-end">
          <div class="left"><span class="big ${left < 0 ? "over" : ""}">${Math.abs(left)}</span><span class="muted">kcal ${left < 0 ? "over" : "left"} of ${t.kcal}</span></div>
          <button class="btn" type="button" id="add">+ Add food</button>
        </div>
        <div class="macros">
          ${macroRow("Protein", "var(--protein)", tot.p, t.p)}
          ${macroRow("Carbs", "var(--carbs)", tot.c, t.c)}
          ${macroRow("Fat", "var(--fat)", tot.f, t.f)}
          ${macroRow("Fibre", "var(--fibre)", tot.fibre, t.fibre)}
        </div>
      </section>
      ${weighCard}
      ${sugg}
      <section class="card">${meals}</section>
    </div>`;
  }
  let lastSuggestions = [];
  const bind = {};
  bind.today = () => {
    $("#prev").onclick = () => { viewDate = N.addDays(viewDate, -1); render(); };
    $("#next").onclick = () => { if (viewDate < today()) { viewDate = N.addDays(viewDate, 1); render(); } };
    $("#add").onclick = () => openSheet();
    $("#view").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => {
      const day = { entries: (S.days[viewDate]?.entries || []).slice() };
      day.entries.splice(Number(b.dataset.del), 1); store.day(viewDate, day); render();
    }));
    $("#view").querySelectorAll("[data-sugg]").forEach((b) => (b.onclick = () => {
      const it = lastSuggestions[Number(b.dataset.sugg)];
      logFood(it.food, it.grams, N.mealForHour(new Date().getHours()));
    }));
    const qw = $("#quick-weigh");
    if (qw) qw.onsubmit = (e) => { e.preventDefault(); const v = Number($("#qw").value); if (v > 0) { store.weight(today(), Math.round(toKg(v) * 10) / 10); render(); } };
  };

  function logFood(food, grams, meal) {
    const day = { entries: (S.days[viewDate]?.entries || []).slice() };
    day.entries.push({ foodId: food.id, name: food.name, grams, meal, t: Date.now(), ...N.portion(food, grams) });
    store.day(viewDate, day);
    render();
  }

  // ---------- Weight ----------
  function weightView(t) {
    const tr = N.trend(S.weights);
    const last = tr[tr.length - 1];
    const rate = N.weeklyChange(S.weights);
    const target = t.weeklyTargetKg;
    const conv = (kg) => (unit() === "lb" ? kg * 2.20462 : kg);
    const sign = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2);
    const first = Object.keys(S.weights).sort()[0];
    const totalChange = last && first ? last.trend - S.weights[first] : null;
    const hist = Object.keys(S.weights).sort().reverse().slice(0, 14);
    return `<div class="app" style="gap:14px">
      <section class="card">
        <form class="row" id="weigh" style="align-items:end">
          <label class="field" style="flex:1 1 120px"><span>Weight (${unit()})</span><input id="w-val" type="number" step="0.1" inputmode="decimal" value="${S.weights[today()] != null ? fmtW(S.weights[today()]) : ""}" placeholder="${fmtW(N.latestWeight(S.weights))}"></label>
          <label class="field" style="flex:1 1 140px"><span>Date</span><input id="w-date" type="date" value="${today()}" max="${today()}"></label>
          <button class="btn" type="submit">Save</button>
        </form>
        <p class="small muted" style="margin:0">Weigh at the same time each morning. The trend line smooths out water and food swings, so judge progress by it, not by single days.</p>
      </section>
      <section class="card">
        <div class="stats">
          <div class="stat"><span class="k">Trend</span><span class="v">${last ? fmtW(last.trend) : "–"}</span><span class="s">${unit()}</span></div>
          <div class="stat"><span class="k">Per week</span><span class="v">${rate == null ? "–" : sign(conv(rate))}</span><span class="s">${rate == null ? "needs 7 days" : `target ${sign(conv(target))}`}</span></div>
          <div class="stat"><span class="k">Since start</span><span class="v">${totalChange == null ? "–" : sign(conv(totalChange)).replace(/(\.\d)\d$/, "$1")}</span><span class="s">${first ? "from " + new Date(first + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : ""}</span></div>
        </div>
        <div class="row spread"><div class="legend"><span><i style="width:8px;height:8px;border-radius:50%;background:var(--muted)"></i>Daily weigh-in</span><span><i style="width:16px;height:2px;background:var(--ink)"></i>Trend</span></div>
          <div class="seg" id="range">${[[30, "30d"], [90, "90d"], [0, "All"]].map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${weightRange === v}">${l}</button>`).join("")}</div></div>
        <div class="chart-wrap" id="chart">${chart(tr)}</div>
      </section>
      <section class="card"><h3>Recent weigh-ins</h3><div class="hist">${hist.length ? hist.map((d) => `<div class="entry"><span>${new Date(d + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}</span><span class="num">${fmtW(S.weights[d])} ${unit()}</span><button class="x" type="button" data-wdel="${d}" aria-label="Delete weigh-in">×</button></div>`).join("") : `<p class="empty">No weigh-ins yet.</p>`}</div></section>
    </div>`;
  }
  let chartPts = [];
  function chart(trAll) {
    const tr = weightRange ? trAll.slice(-weightRange) : trAll;
    if (tr.length < 2) return `<p class="empty">Log two or more weigh-ins to see your trend.</p>`;
    const W = 380, H = 200, L = 38, R = 8, T = 10, B = 24;
    const vals = tr.flatMap((p) => [p.trend, p.weight].filter((x) => x != null)).map((kg) => Number(fmtW(kg, 2)));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const pad = Math.max(0.4, (hi - lo) * 0.15); lo -= pad; hi += pad;
    const step = [0.25, 0.5, 1, 2, 5, 10].find((s) => (hi - lo) / s <= 5) || 20;
    const x = (i) => L + (i / (tr.length - 1)) * (W - L - R);
    const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    let grid = "";
    for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-num)">${Number(v.toFixed(2))}</text>`;
    const fmtD = (d) => new Date(d + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const xl = `<text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${fmtD(tr[0].date)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtD(tr[tr.length - 1].date)}</text>`;
    const conv = (kg) => Number(fmtW(kg, 2));
    const line = tr.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(conv(p.trend)).toFixed(1)}`).join("");
    const dots = tr.map((p, i) => (p.weight == null ? "" : `<circle cx="${x(i).toFixed(1)}" cy="${y(conv(p.weight)).toFixed(1)}" r="3" fill="var(--muted)" fill-opacity="0.55"/>`)).join("");
    const lastI = tr.length - 1;
    chartPts = tr.map((p, i) => ({ ...p, cx: x(i), cy: y(conv(p.trend)) }));
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend chart">${grid}${xl}${dots}
      <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(lastI)}" cy="${y(conv(tr[lastI].trend))}" r="4.5" fill="var(--ink)" stroke="var(--card)" stroke-width="2"/>
      <line id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" id="hit"/></svg><div class="tip" id="tip" hidden></div>`;
  }
  bind.weight = () => {
    $("#weigh").onsubmit = (e) => {
      e.preventDefault();
      const v = Number($("#w-val").value), d = $("#w-date").value || today();
      if (v > 0 && d <= today()) { store.weight(d, Math.round(toKg(v) * 10) / 10); render(); }
    };
    $("#range").onclick = (e) => { const b = e.target.closest("button"); if (b) { weightRange = Number(b.dataset.v); render(); } };
    $("#view").querySelectorAll("[data-wdel]").forEach((b) => (b.onclick = () => { store.weight(b.dataset.wdel, null); render(); }));
    const hit = $("#hit"); if (!hit) return;
    const svg = hit.ownerSVGElement, tip = $("#tip"), cross = $("#cross");
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), sx = ((ev.clientX - r.left) / r.width) * 380;
      let best = chartPts[0];
      for (const p of chartPts) if (Math.abs(p.cx - sx) < Math.abs(best.cx - sx)) best = p;
      cross.setAttribute("x1", best.cx); cross.setAttribute("x2", best.cx); cross.setAttribute("visibility", "visible");
      tip.hidden = false;
      tip.innerHTML = `<strong>${new Date(best.date + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })}</strong><br>Trend <span class="num">${fmtW(best.trend)}</span>${best.weight != null ? ` · Weighed <span class="num">${fmtW(best.weight)}</span>` : ""} ${unit()}`;
      const px = (best.cx / 380) * r.width, py = (best.cy / 200) * r.height;
      tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, px - tip.offsetWidth / 2)) + "px";
      tip.style.top = Math.max(0, py - tip.offsetHeight - 12) + "px";
    };
    hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
    hit.addEventListener("pointerleave", () => { tip.hidden = true; cross.setAttribute("visibility", "hidden"); });
  };

  // ---------- Foods library ----------
  function foodsView() {
    const hab = N.habits(S.days, today(), 365);
    const list = Object.values(S.foods)
      .filter((f) => !foodQuery || (f.name + " " + (f.brand || "")).toLowerCase().includes(foodQuery.toLowerCase()))
      .sort((a, b) => (hab[b.id]?.uses || 0) - (hab[a.id]?.uses || 0) || a.name.localeCompare(b.name));
    return `<div class="app" style="gap:14px">
      <section class="card">
        <div class="row"><input type="search" id="fq" placeholder="Search your foods" value="${esc(foodQuery)}" style="flex:1" aria-label="Search your foods"><button class="btn" type="button" id="newfood">New food</button></div>
        <p class="small muted" style="margin:0">Every food you scan or enter is kept here. Suggestions on the Today tab come from this list and how often you eat each item.</p>
      </section>
      <section class="card">${list.length ? list.map((f) => `<div class="entry"><div><div class="nm">${esc(f.name)}${f.brand ? ` <span class="muted small">${esc(f.brand)}</span>` : ""}</div>
        <div class="sub num">per 100g: ${f.per100.kcal} kcal · P ${f.per100.p} · C ${f.per100.c} · F ${f.per100.f}${f.servingG ? ` · serving ${f.servingG}g` : ""}</div></div>
        <span class="small muted">${hab[f.id] ? hab[f.id].uses + "×" : ""}</span><button class="btn ghost small" type="button" data-edit="${esc(f.id)}">Edit</button></div>`).join("")
        : `<p class="empty">${foodQuery ? "No foods match." : "No foods yet. Scan a barcode or add one from the Today tab."}</p>`}</section>
    </div>`;
  }
  bind.foods = () => {
    const q = $("#fq");
    q.oninput = () => { foodQuery = q.value; const pos = q.selectionStart; render(); const n = $("#fq"); n.focus(); n.setSelectionRange(pos, pos); };
    $("#newfood").onclick = () => openSheet({ step: "form", food: blankFood(), editOnly: true });
    $("#view").querySelectorAll("[data-edit]").forEach((b) => (b.onclick = () => openSheet({ step: "form", food: { ...S.foods[b.dataset.edit] }, editOnly: true, existing: true })));
  };

  // ---------- Plan ----------
  function planView(t) {
    if (!S.profile) { draft = draft || { ...DEFAULT_PROFILE }; return setupCard(); }
    draft = draft || { ...S.profile, startWeight: N.latestWeight(S.weights) || S.profile.startWeight };
    const ins = N.insights({ foods: S.foods, days: S.days, weights: S.weights, today: today(), target: t, goal: S.profile.goal });
    const icon = { good: "✓", warn: "!", swap: "⇄", info: "i" };
    const m = t.measured;
    return `<div class="app" style="gap:14px">
      <section class="card">
        <h2>Daily targets</h2>
        <div class="preview"><div><b>${t.kcal}</b><span>kcal</span></div><div><b style="color:var(--protein)">${t.p}</b><span>protein g</span></div><div><b style="color:var(--carbs)">${t.c}</b><span>carbs g</span></div><div><b style="color:var(--fat)">${t.f}</b><span>fat g</span></div></div>
        <p class="small muted" style="margin:0">${m ? `Maintenance is <strong>${m.kcal} kcal</strong>, measured from ${m.daysLogged} logged days and your weight trend (the formula estimate was ${t.estimate}).${m.kcal < t.estimate * 0.75 ? " That's well below the formula. If some snacks, drinks or cooking oil go unlogged, the measured figure reads low." : ""}` : `Maintenance is <strong>${t.estimate} kcal</strong>, estimated from the Mifflin-St Jeor formula. After about two weeks of logging food and weight most days, it switches to your measured number.`}
        ${S.profile.goal === "lose" ? `Target is a ${Math.abs(t.weeklyTargetKg)} kg/week loss.` : S.profile.goal === "gain" ? `Target is a ${t.weeklyTargetKg} kg/week gain.` : ""} Protein is set at ${N.GOALS[S.profile.goal].proteinPerKg} g per kg of body weight.</p>
      </section>
      <section class="card"><h2>What your log says</h2>${ins.map((i) => `<div class="insight"><span class="ic ${i.kind}" aria-hidden="true">${icon[i.kind]}</span><span>${esc(i.text)}</span></div>`).join("")}</section>
      ${sample ? `<section class="card"><div class="row spread"><h2>Ask Claude</h2><button class="btn small" type="button" id="coach" ${coachBusy ? "disabled" : ""}>${coachBusy ? "Thinking…" : coachText ? "Ask again" : "Review my last 2 weeks"}</button></div>
        ${coachText ? `<div class="coach">${esc(coachText)}</div>` : `<p class="small muted" style="margin:0">Sends your targets, daily totals, most-eaten foods and weight trend to Claude for specific suggestions.</p>`}</section>` : ""}
      <h2 style="margin-top:6px">Your details</h2>
      ${profileForm(draft, "Update targets")}
      <section class="card"><h3>Backup</h3><p class="small muted" style="margin:0">${mode === "db" ? "Your log is saved to your Claude account and syncs wherever you open this page." : "Your log is saved in this browser only. Copy a backup now and then."}</p>
        <div class="row"><button class="btn ghost small" type="button" id="backup">Copy backup</button><button class="btn ghost small" type="button" id="restore">Restore from backup</button></div><div id="backup-out"></div></section>
    </div>`;
  }
  bind.plan = () => {
    if (!S.profile) { bindSetup(); return; }
    bindProfile();
    const c = $("#coach"); if (c) c.onclick = runCoach;
    $("#backup").onclick = () => {
      const text = JSON.stringify({ app: "fuel-log", v: 1, profile: S.profile, weights: S.weights, foods: S.foods, days: S.days });
      const out = $("#backup-out");
      const show = () => { out.innerHTML = `<textarea id="backup-text" rows="4" readonly></textarea>`; const ta = $("#backup-text"); ta.value = text; ta.select(); };
      try { navigator.clipboard.writeText(text).then(() => { out.innerHTML = `<p class="small" style="margin:0;color:var(--good)">Copied ${Object.keys(S.days).length} days, ${Object.keys(S.weights).length} weigh-ins and ${Object.keys(S.foods).length} foods.</p>`; }, show); } catch (e) { show(); }
    };
    $("#restore").onclick = () => {
      const out = $("#backup-out");
      out.innerHTML = `<textarea id="restore-text" rows="4" placeholder="Paste a backup here"></textarea><div class="row" style="margin-top:8px"><button class="btn small" type="button" id="restore-go">Restore</button><span class="small muted">Adds to what's here; same-day entries are replaced.</span></div>`;
      $("#restore-go").onclick = () => {
        try {
          const b = JSON.parse($("#restore-text").value);
          if (b.app !== "fuel-log") throw new Error();
          if (b.profile) store.profile(b.profile);
          for (const [d, kg] of Object.entries(b.weights || {})) store.weight(d, kg);
          for (const f of Object.values(b.foods || {})) store.food(f);
          for (const [d, day] of Object.entries(b.days || {})) store.day(d, day);
          render();
        } catch (e) { out.insertAdjacentHTML("beforeend", `<p class="small" style="color:var(--warn)">That isn't a Fuel Log backup. Copy it again from the Backup section.</p>`); }
      };
    };
  };

  async function runCoach() {
    const t = currentTargets(); coachBusy = true; coachText = ""; render();
    const start = N.addDays(today(), -14);
    const daily = Object.entries(S.days).filter(([d]) => d >= start).sort().map(([d, day]) => ({ date: d, ...N.totals(day.entries) }));
    const hab = N.habits(S.days, today(), 30);
    const top = Object.entries(hab).sort((a, b) => b[1].kcal - a[1].kcal).slice(0, 15).map(([id, h]) => {
      const f = S.foods[id]; return f && { food: f.name, timesEaten: h.uses, usualGrams: h.avgGrams, per100g: f.per100 };
    }).filter(Boolean);
    const data = { goal: N.GOALS[S.profile.goal].label, targets: { kcal: t.kcal, protein: t.p, carbs: t.c, fat: t.f }, maintenance: t.maintenance, maintenanceMeasured: !!t.measured,
      weightKg: t.kg, trendKgPerWeek: N.weeklyChange(S.weights), targetKgPerWeek: t.weeklyTargetKg, last14Days: daily, mostEatenFoods: top };
    const prompt = `You are a practical sports nutrition coach. Here is two weeks of someone's food and weight log as JSON. Their goal: ${data.goal}.\n\n${JSON.stringify(data)}\n\nGive 4 to 6 short, specific recommendations in plain UK English, as a numbered list. Prefer changes to foods they already eat (name them, with grams and the effect on calories or protein). Comment on whether the weight trend matches the goal and what to change if not. No preamble, no medical claims, under 220 words.`;
    try {
      const r = await sample(prompt, { onText: ({ text }) => { coachText = text; const el = $(".coach"); if (el) el.textContent = text; else render(); } });
      coachText = r.text;
    } catch (e) {
      coachText = e && e.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : e && e.code === "not_granted" ? "Claude access wasn't allowed for this page." : "Couldn't reach Claude. Try again shortly.";
    }
    coachBusy = false; render();
  }

  // ---------- Add-food sheet ----------
  const dlg = $("#sheet");
  let sh = null;
  const blankFood = (barcode) => ({ id: barcode ? "bc-" + barcode : "f-" + uid(), barcode: barcode || "", name: "", brand: "", per100: { kcal: "", p: "", c: "", f: "", fibre: "" }, servingG: "" });
  function openSheet(state) {
    sh = { step: "choose", q: "", meal: N.mealForHour(new Date().getHours()), ...state };
    drawSheet();
    if (!dlg.open) dlg.showModal();
  }
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("close", () => stopCamera());

  // Live scanning: ZXing reads frames from the rear camera until it finds a code.
  let camReader = null;
  function stopCamera() { if (camReader) { try { camReader.reset(); } catch (e) {} camReader = null; } }
  async function startCamera(video) {
    stopCamera();
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
    const reader = camReader = new ZXing.BrowserMultiFormatReader(hints, 150);
    try {
      await reader.decodeFromConstraints({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } }, video, (result) => {
        if (!result || camReader !== reader) return;
        stopCamera();
        if (navigator.vibrate) navigator.vibrate(60);
        lookupBarcode(result.getText());
      });
      const st = $("#cam-status"); if (st) st.textContent = "Hold the barcode flat and fill most of the frame.";
    } catch (e) {
      stopCamera();
      const st = $("#cam-status");
      if (st) { st.className = "status warn"; st.textContent = e && e.name === "NotAllowedError" ? "Camera access is off. Allow it in your phone's settings for this app, or use Barcode photo." : "Couldn't start the camera. Use Barcode photo instead."; }
    }
  }
  function drawSheet() {
    const el = $("#sheet-body");
    const head = (title) => `<div class="row spread"><h2>${title}</h2><button class="x" type="button" id="sh-close" aria-label="Close">×</button></div>`;
    if (sh.step === "choose") {
      const hab = N.habits(S.days, today(), 120);
      const list = Object.values(S.foods)
        .filter((f) => !sh.q || (f.name + " " + (f.brand || "")).toLowerCase().includes(sh.q.toLowerCase()))
        .sort((a, b) => (hab[b.id]?.uses || 0) - (hab[a.id]?.uses || 0)).slice(0, 30);
      el.innerHTML = head("Add food") + `
        <div class="choices">
          ${liveScanOk ? `<button class="choice" type="button" id="live"><strong>Scan barcode</strong><span>Point your camera at it</span></button>` : ""}
          <label class="choice"><strong>${liveScanOk ? "Barcode photo" : "Scan barcode"}</strong><span>Take a photo of the barcode</span><input type="file" id="bc-file" accept="image/*" capture="environment"></label>
          ${imagesOk ? `<label class="choice"><strong>Read label</strong><span>Photo of the nutrition panel; Claude fills it in</span><input type="file" id="lbl-file" accept="image/*" capture="environment"></label>` : ""}
          <button class="choice" type="button" id="manual"><strong>Enter manually</strong><span>Type the per-100g values</span></button>
          <button class="choice" type="button" id="typebc"><strong>Type barcode</strong><span>If the photo won't read</span></button>
        </div>
        ${sh.status ? `<div class="status ${sh.statusKind || ""}" role="status">${esc(sh.status)}</div>` : ""}
        <input type="search" id="sh-q" placeholder="Search your foods" value="${esc(sh.q)}" aria-label="Search your foods">
        <div class="results">${list.length ? list.map((f) => `<button type="button" class="result" data-pick="${esc(f.id)}"><span>${esc(f.name)}${f.brand ? ` <span class="muted small">${esc(f.brand)}</span>` : ""}</span><span class="small muted num">${f.per100.kcal}/100g</span></button>`).join("") : `<p class="empty">${sh.q ? "No match in your foods." : "Foods you add will appear here for one-tap logging."}</p>`}</div>`;
      $("#bc-file").onchange = (e) => e.target.files[0] && handleBarcodePhoto(e.target.files[0]);
      const lv = $("#live"); if (lv) lv.onclick = () => { sh.step = "camera"; drawSheet(); };
      const lf = $("#lbl-file"); if (lf) lf.onchange = (e) => e.target.files[0] && readLabel(e.target.files[0], blankFood());
      $("#manual").onclick = () => { sh.step = "form"; sh.food = blankFood(); drawSheet(); };
      $("#typebc").onclick = () => { sh.step = "typebc"; drawSheet(); };
      const q = $("#sh-q"); q.oninput = () => { sh.q = q.value; const p = q.selectionStart; drawSheet(); const n = $("#sh-q"); n.focus(); n.setSelectionRange(p, p); };
      el.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => { sh.step = "portion"; sh.food = S.foods[b.dataset.pick]; drawSheet(); }));
    } else if (sh.step === "typebc") {
      el.innerHTML = head("Type barcode") + `<form id="tbc" class="row"><input type="text" id="tbc-v" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 5000159484695" style="flex:1" aria-label="Barcode number"><button class="btn" type="submit">Look up</button></form><button class="link" type="button" id="back">Back</button>`;
      $("#tbc").onsubmit = (e) => { e.preventDefault(); const v = $("#tbc-v").value.replace(/\D/g, ""); if (v.length >= 8) lookupBarcode(v); };
      $("#back").onclick = () => { sh.step = "choose"; drawSheet(); };
      $("#tbc-v").focus();
    } else if (sh.step === "camera") {
      el.innerHTML = head("Scan barcode") + `<video id="cam" playsinline muted style="width:100%;border-radius:10px;background:#000;aspect-ratio:4/3;object-fit:cover"></video>
        <div class="status" role="status" id="cam-status">Starting camera…</div>
        <button class="link" type="button" id="back">Back</button>`;
      $("#back").onclick = () => { stopCamera(); sh.step = "choose"; drawSheet(); };
      startCamera($("#cam"));
    } else if (sh.step === "busy") {
      el.innerHTML = head("Add food") + `<div class="status" role="status">${esc(sh.status)}</div>`;
    } else if (sh.step === "form") {
      const f = sh.food;
      const num = (k, label) => `<label class="field"><span>${label}</span><input type="number" step="0.1" inputmode="decimal" id="ff-${k}" value="${f.per100[k] ?? ""}"></label>`;
      el.innerHTML = head(sh.existing ? "Edit food" : "New food") + `
        ${sh.status ? `<div class="status ${sh.statusKind || ""}" role="status">${esc(sh.status)}</div>` : ""}
        <form id="ff" class="grid2" style="grid-template-columns:minmax(0,1fr)">
          <label class="field"><span>Name</span><input type="text" id="ff-name" value="${esc(f.name)}" required></label>
          <div class="grid2"><label class="field"><span>Brand</span><input type="text" id="ff-brand" value="${esc(f.brand)}"></label><label class="field"><span>Barcode</span><input type="text" id="ff-barcode" inputmode="numeric" value="${esc(f.barcode)}"></label></div>
          <h3>Per 100g</h3>
          <div class="grid3">${num("kcal", "Calories")}${num("p", "Protein g")}${num("c", "Carbs g")}${num("f", "Fat g")}${num("fibre", "Fibre g")}<label class="field"><span>Serving g</span><input type="number" inputmode="decimal" id="ff-serving" value="${f.servingG ?? ""}"></label></div>
          ${imagesOk && !sh.existing ? `<label class="btn ghost wide" style="position:relative;text-align:center">Fill from a label photo<input type="file" id="ff-label" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>` : ""}
          <div class="row">${sh.existing ? `<button class="btn ghost" type="button" id="ff-del">Delete</button>` : ""}<button class="btn" type="submit" style="flex:1">${sh.editOnly ? "Save food" : "Save and choose amount"}</button></div>
        </form>`;
      const fl = $("#ff-label"); if (fl) fl.onchange = (e) => e.target.files[0] && readLabel(e.target.files[0], collectForm());
      const del = $("#ff-del"); if (del) del.onclick = () => { store.dropFood(f.id); dlg.close(); render(); };
      $("#ff").onsubmit = (e) => {
        e.preventDefault();
        const food = collectForm();
        if (!food.name || !(food.per100.kcal >= 0)) return;
        store.food(food);
        if (sh.editOnly) { dlg.close(); render(); return; }
        sh.step = "portion"; sh.food = food; sh.status = null; drawSheet();
      };
    } else if (sh.step === "portion") {
      const f = sh.food;
      const hab = N.habits(S.days, today(), 120)[f.id];
      sh.grams = sh.grams || hab?.avgGrams || f.servingG || 100;
      const chips = [...new Set([f.servingG, hab?.avgGrams, 100, 50, 150].filter(Boolean))];
      const n = N.portion(f, sh.grams);
      el.innerHTML = head(esc(f.name)) + `
        <div class="preview"><div><b>${n.kcal}</b><span>kcal</span></div><div><b style="color:var(--protein)">${n.p}</b><span>protein</span></div><div><b style="color:var(--carbs)">${n.c}</b><span>carbs</span></div><div><b style="color:var(--fat)">${n.f}</b><span>fat</span></div></div>
        <div class="grid2"><label class="field"><span>Amount (g or ml)</span><input type="number" id="pg" inputmode="decimal" value="${sh.grams}"></label>
          <label class="field"><span>Meal</span><select id="pm">${N.MEALS.map((m) => `<option value="${m}" ${m === sh.meal ? "selected" : ""}>${m[0].toUpperCase() + m.slice(1)}</option>`).join("")}</select></label></div>
        <div class="chips">${chips.map((g) => `<button type="button" data-g="${g}">${g}g${g === f.servingG ? " (serving)" : g === hab?.avgGrams ? " (usual)" : ""}</button>`).join("")}</div>
        <button class="btn wide" type="button" id="log">Log ${viewDate === today() ? "for today" : "for " + new Date(viewDate + "T12:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</button>
        <button class="link" type="button" id="editfood">Edit nutrition values</button>`;
      const pg = $("#pg");
      pg.oninput = () => { sh.grams = Number(pg.value) || 0; const v = N.portion(f, sh.grams); el.querySelectorAll(".preview b").forEach((b, i) => (b.textContent = [v.kcal, v.p, v.c, v.f][i])); };
      $("#pm").onchange = (e) => (sh.meal = e.target.value);
      el.querySelectorAll("[data-g]").forEach((b) => (b.onclick = () => { sh.grams = Number(b.dataset.g); drawSheet(); }));
      $("#log").onclick = () => { if (sh.grams > 0) { dlg.close(); logFood(f, sh.grams, sh.meal); } };
      $("#editfood").onclick = () => { sh.step = "form"; sh.food = { ...f }; sh.existing = true; drawSheet(); };
    }
    const c = $("#sh-close"); if (c) c.onclick = () => dlg.close();
  }
  function collectForm() {
    const g = (id) => $("#ff-" + id).value;
    const n = (id) => (g(id) === "" ? 0 : Math.round(Number(g(id)) * 10) / 10);
    const barcode = g("barcode").replace(/\D/g, "");
    const id = sh.food.id || (barcode ? "bc-" + barcode : "f-" + uid());
    return { ...sh.food, id, barcode, name: g("name").trim(), brand: g("brand").trim(), per100: { kcal: Math.round(n("kcal")), p: n("p"), c: n("c"), f: n("f"), fibre: n("fibre") }, servingG: n("serving") || null };
  }

  // Shrink big phone photos before decoding or sending them anywhere.
  async function shrink(file, max = 1400) {
    const img = await createImageBitmap(file);
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c;
  }
  async function decodeBarcode(file) {
    const canvas = await shrink(file, 1600);
    if ("BarcodeDetector" in window) {
      try {
        const found = await new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] }).detect(canvas);
        if (found.length) return found[0].rawValue;
      } catch (e) {}
    }
    if (window.ZXing) {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.BrowserMultiFormatReader(hints);
      try { return (await reader.decodeFromImageUrl(canvas.toDataURL("image/jpeg", 0.92))).getText(); } catch (e) {}
    }
    return null;
  }
  async function handleBarcodePhoto(file) {
    sh.step = "busy"; sh.status = "Reading barcode…"; drawSheet();
    const code = await decodeBarcode(file).catch(() => null);
    if (!code) { sh.step = "choose"; sh.status = "Couldn't read a barcode in that photo. Get closer, fill the frame with the barcode, and avoid glare. Or type the number."; sh.statusKind = "warn"; drawSheet(); return; }
    lookupBarcode(code);
  }
  async function lookupBarcode(code) {
    sh.statusKind = "";
    const known = Object.values(S.foods).find((f) => f.barcode === code);
    if (known) { sh.step = "portion"; sh.food = known; sh.status = null; drawSheet(); return; }
    sh.step = "busy"; sh.status = `Barcode ${code}. Looking it up…`; drawSheet();
    let food = null;
    try {
      const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_quantity`, { signal: ctl.signal });
      clearTimeout(timer);
      const j = await r.json();
      if (j.product) food = N.fromOpenFoodFacts(code, j.product);
    } catch (e) {}
    sh.step = "form";
    if (food) { sh.food = food; sh.status = "Found on Open Food Facts. Check the values against the pack, then save."; sh.statusKind = ""; }
    else {
      sh.food = blankFood(code);
      sh.status = imagesOk ? `Barcode ${code} is new. Photograph the nutrition label and Claude will fill this in, or type the values. Next time you scan it, it's instant.` : `Barcode ${code} is new. Enter the values from the pack once; next time you scan it, it's instant.`;
      sh.statusKind = "warn";
    }
    drawSheet();
  }
  async function readLabel(file, base) {
    sh.step = "busy"; sh.status = "Claude is reading the label…"; drawSheet();
    try {
      const canvas = await shrink(file, 1400);
      const blob = await new Promise((r) => canvas.toBlob(r, "image/jpeg", 0.85));
      const out = await sample.json(
        `This photo shows a food package's nutrition label (and maybe its front). Read the PER 100g (or per 100ml) column. Use kcal, not kJ; if only kJ is shown, divide by 4.184. Return JSON only: {"name": product name or "" if not visible, "brand": "" if not visible, "kcal": number, "protein": number, "carbs": number, "fat": number, "fibre": number or 0, "servingG": serving size in grams or null}. Use null for any value you cannot read.`,
        { images: [blob], modelTier: "default" });
      const v = (x) => (typeof x === "number" && isFinite(x) ? x : "");
      sh.food = { ...base, name: base.name || out.name || "", brand: base.brand || out.brand || "", per100: { kcal: v(out.kcal), p: v(out.protein), c: v(out.carbs), f: v(out.fat), fibre: v(out.fibre) }, servingG: out.servingG || base.servingG || "", source: "label" };
      sh.status = "Filled from the label. Check the numbers, then save."; sh.statusKind = "";
    } catch (e) {
      sh.food = base;
      sh.status = e && e.code === "rate_limited" ? "Claude is busy. Try the photo again in a minute, or type the values." : "Couldn't read that label. Try a sharper, straight-on photo, or type the values.";
      sh.statusKind = "warn";
    }
    sh.step = "form"; drawSheet();
  }

  loadLocal();
  render();
  connect().catch(() => { booting = false; setStore(); render(); });
})();
</script>
