[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep"
version = "0.1.0"
description = "Elite interview coach for business development and partnerships roles, powered by Claude."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2",
    "pypdf>=4",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prep = "interview_prep.cli:main"

[tool.setuptools]
packages = ["interview_prep"]
